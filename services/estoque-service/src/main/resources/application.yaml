server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: estoque-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:estoque_db}
    username: ${DB_USER:threedcontrol}
    password: ${DB_PASSWORD:threedcontrol}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  swagger-ui:
    path: /swagger-ui.html
